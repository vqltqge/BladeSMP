# ==============================
#          BLADE SMP
#          config.yml
# ==============================
#
# Time values are in seconds unless stated otherwise.
# Damage values use Minecraft HP:
# 1 heart = 2 HP.


# ==============================
#          STORM BLADE
# ==============================

storm:

  passive:
    # Number of hits required to trigger the lightning passive.
    hits-to-strike: 10

  ability-one:
    # Thunderstorm
    cooldown: 60
    duration: 10

    # 1 = lightning every hit
    # 2 = every second hit
    # 3 = every third hit, etc.
    strike-hits: 1

    # How long the player has to land the first hit
    # after charging the ability.
    charge-duration: 60

  ability-two:
    # Thunderfield
    cooldown: 120
    duration: 10
    radius: 10.0
    # Strike one player, then cycle to the next every N ticks.
    strike-interval: 5
    regen-amplifier: 1
    slowness-amplifier: 0
    weakness-amplifier: 0

# ==============================
#          BLOOM BLADE
# ==============================

bloom:

  passive:
    # Number of hits required to activate the healing passive.
    hits-to-activate: 10

  ability-one:
    # Vital Surge
    cooldown: 60
    duration: 15

    # Maximum health while the ability is active.
    # Measured in HP: 30 HP = 15 hearts.
    max-hearts: 30

    # If true, the extra health gained is also healed.
    heal-hearts: true

  ability-two:
    cooldown: 100
    duration: 10

    # Radius of the ability in blocks.
    radius: 3.0

    # Minimum HP used by the ability.
    # 8 HP = 4 hearts.
    min-hp: 8


# ==============================
#          FLAME BLADE
# ==============================

flame:

  ability-one:
    # Flame Sweep
    cooldown: 60

    damage: 24.0
    knockback: 1.2
    range: 4.0

  ability-two:
    # Inferno
    cooldown: 90

    damage: 10.0
    radius: 5.0

    # Horizontal knockback strength.
    knockback: 2.0

    # Vertical launch strength.
    upward-knockback: 0.7


# ==============================
#          FROST BLADE
# ==============================

frost:

  passive:
    # Number of hits required to freeze the enemy.
    hits-to-freeze: 10

  ability-one:
    # Frozen Dash
    cooldown: 45

    dash-velocity: 2.0

    # Freeze duration in seconds.
    freeze-duration: 3

    damage: 16.0

  ability-two:
    cooldown: 60
    duration: 5

    # Radius in blocks.
    radius: 3.0

    # Damage dealt to affected/frozen targets.
    # 2.0 = 2x damage.
    damage-multiplier: 2.0


# ==============================
#          PULSE BLADE
# ==============================

pulse:

  ability-one:
    cooldown: 30
    dash-velocity: 2.0

  ability-two:
    # Shockwave
    cooldown: 60
    upwardVelocity: 1.5
    downwardVelocity: 1.5
    damage: 6.0
    radius: 3.0
    knockback: 1.2
    upward-knockback: 0.7


# ==============================
#         FORTUNE BLADE
# ==============================

fortune:

  passive:
    # 2.0 = double XP.
    xp-multiplier: 2.0

  ability-one:
    cooldown: 60
    duration: 15

    # Items affected by the ability.
    #
    # IMPORTANT:
    # Your PlayerConsumeListener currently reads this list.
    # Add Bukkit Material names here.
    items: [ ]

  ability-two:
    # Lucky Strike
    cooldown: 60
    duration: 15

    # Maximum random damage multiplier.
    # 1.5 = maximum of 1.5x damage.
    max-damage: 1.5

    # Time allowed to land the hit after charging.
    charge-duration: 60


# ==============================
#          TIDAL BLADE
# ==============================

tidal:

  ability-one:
    cooldown: 60
    duration: 10

    # Potion amplifier as displayed in-game.
    # 1 = Resistance I
    # 2 = Resistance II
    # 3 = Resistance III
    resistance-amplifier: 2

    # Ability radius in blocks.
    radius: 3.0
  ability-two:
    # Riptide - pulls nearby enemies inward, then launches them away.
    cooldown: 60
    radius: 8.0
    pull-velocity: 0.6
    knockback: 2.0
    damage: 8.0

