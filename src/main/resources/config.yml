# ==============================
#          BLADE SMP
# ==============================
#
# Time values are in seconds unless stated otherwise.
# Damage values use Minecraft HP:
# 1 heart = 2 HP.

# ==============================
#          BLOOM BLADE
# ==============================

bloom:

  passive:
    # Number of hits required to activate the healing passive.
    hits-to-activate: 10

  ability-one:
    # Vital Surge
    cooldown: 60
    duration: 15

    # Maximum health while the ability is active.
    # Measured in HP: 30 HP = 15 hearts.
    max-hearts: 30

    # If true, the extra health gained is also healed.
    heal-hearts: true

  ability-two:
    cooldown: 100
    duration: 10

    # Radius of the ability in blocks.
    radius: 3.0

    # Minimum HP used by the ability.
    # 8 HP = 4 hearts.
    min-hp: 8


# ==============================
#          FLAME BLADE
# ==============================

flame:

  ability-one:
    # Flame Sweep
    cooldown: 60

    damage: 24.0
    knockback: 1.2
    range: 4.0

  ability-two:
    # Inferno
    cooldown: 90

    damage: 40.0
    radius: 3.0

    # Horizontal knockback strength.
    knockback: 2.0

    # Vertical launch strength.
    upward-knockback: 0.7


# ==============================
#          FROST BLADE
# ==============================

frost:

  passive:
    # Number of hits required to freeze the enemy.
    hits-to-freeze: 10

  ability-one:
    # Frozen Dash
    cooldown: 45

    dash-velocity: 2.0

    # Freeze duration in seconds.
    freeze-duration: 3

    damage: 16.0

  ability-two:
    cooldown: 60
    duration: 5

    # Radius in blocks.
    radius: 3.0

    # Damage dealt to affected/frozen targets.
    # 2.0 = 2x damage.
    damage-multiplier: 2.0


# ==============================
#          PULSE BLADE
# ==============================

pulse:

  ability-one:
    cooldown: 30
    dash-velocity: 2.0

  ability-two:
    # Shockwave
    cooldown: 60
    upward-velocity: 1.5
    downward-velocity: 1.5
    damage: 24.0
    radius: 3.0
    knockback: 1.2
    upward-knockback: 0.7


# ==============================
#         FORTUNE BLADE
# ==============================

fortune:

  passive:
    # 2.0 = double XP.
    xp-multiplier: 2.0

  ability-one:
    cooldown: 60
    duration: 15

    # Items affected by the ability.
    items: [ "APPLE", "BAKED_POTATO", "BEEF", "BEETROOT", "BEETROOT_SOUP", "BREAD", "CARROT", "CHICKEN", "CHORUS_FRUIT", "COD", "COOKED_BEEF", "COOKED_CHICKEN", "COOKED_COD", "COOKED_MUTTON", "COOKED_PORKCHOP", "COOKED_RABBIT", "COOKED_SALMON", "COOKIE", "DRIED_KELP", "GLOW_BERRIES", "GOLDEN_APPLE", "GOLDEN_CARROT", "HONEY_BOTTLE", "MELON_SLICE", "MUSHROOM_STEW", "MUTTON", "POISONOUS_POTATO", "PORKCHOP", "POTATO", "PUFFERFISH", "PUMPKIN_PIE", "RABBIT", "RABBIT_STEW", "ROTTEN_FLESH", "SALMON", "SPIDER_EYE", "SUSPICIOUS_STEW", "SWEET_BERRIES", "TROPICAL_FISH" ]

  ability-two:
    # Lucky Strike
    cooldown: 60
    duration: 15

    # Maximum random damage multiplier.
    # 1.5 = maximum of 1.5x damage.
    max-damage: 1.5

    # Time allowed to land the hit after charging.
    charge-duration: 60