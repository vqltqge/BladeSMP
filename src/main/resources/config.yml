# ==============================
#          BLADE SMP
# ==============================
#
# Time values are in seconds unless stated otherwise.
# Distance values (like radii) are in blocks
# Damage/health values use Minecraft HP:
# 1 heart = 2 HP.

# ==============================
#          BLOOM BLADE
# ==============================

bloom:

  passive:
    enabled: true
    # Number of hits required to activate the healing passive.
    hits-to-activate: 10

  ability-one:
    enabled: true
    # Vital Surge
    cooldown: 60
    duration: 15

    # Maximum health while the ability is active.
    # Measured in HP: 30 HP = 15 hearts.
    max-hearts: 30

    # If true, the extra health gained is also healed.
    heal-hearts: true

  ability-two:
    enabled: true
    cooldown: 100
    duration: 10

    # Radius of the ability in blocks.
    radius: 3.0

    # Minimum HP used by the ability.
    # 8 HP = 4 hearts.
    min-hp: 8


# ==============================
#          FLAME BLADE
# ==============================

flame:

  ability-one:
    enabled: true
    # Flame Sweep
    cooldown: 60

    damage: 24.0
    knockback: 1.2
    range: 4.0

  ability-two:
    enabled: true
    # Inferno
    cooldown: 90

    damage: 40.0
    radius: 3.0

    # Horizontal knockback strength.
    knockback: 2.0

    # Vertical launch strength.
    upward-knockback: 0.7


# ==============================
#          FROST BLADE
# ==============================

frost:

  passive:
    enabled: true
    # Number of hits required to freeze the enemy.
    hits-to-freeze: 10
    freeze-duration: 0.5 # in seconds

  ability-one:
    enabled: true
    # Frozen Dash
    cooldown: 45

    dash-velocity: 2.0

    # Freeze duration in seconds.
    freeze-duration: 3

    damage: 16.0

  ability-two:
    enabled: true
    cooldown: 60
    duration: 5

    # Radius in blocks.
    radius: 3.0

    # Damage dealt to affected/frozen targets.
    # 2.0 = 2x damage.
    damage-multiplier: 1.1


# ==============================
#          PULSE BLADE
# ==============================

pulse:

  ability-one:
    enabled: true
    cooldown: 30
    dash-velocity: 2.0

  ability-two:
    enabled: true
    # Shockwave
    cooldown: 60
    upward-velocity: 1.5
    downward-velocity: 1.5
    damage: 24.0
    radius: 3.0
    knockback: 1.2
    upward-knockback: 0.7


# ==============================
#         FORTUNE BLADE
# ==============================

fortune:

  passive:
    enabled: true
    # 2.0 = double XP.
    xp-multiplier: 2.0

  ability-one:
    enabled: true
    cooldown: 60
    duration: 15

    # Items affected by the ability. This includes all food items excluding enchanted golden apples
    items: [ "APPLE", "BAKED_POTATO", "BEEF", "BEETROOT", "BEETROOT_SOUP", "BREAD", "CARROT", "CHICKEN", "CHORUS_FRUIT", "COD", "COOKED_BEEF", "COOKED_CHICKEN", "COOKED_COD", "COOKED_MUTTON", "COOKED_PORKCHOP", "COOKED_RABBIT", "COOKED_SALMON", "COOKIE", "DRIED_KELP", "GLOW_BERRIES", "GOLDEN_APPLE", "GOLDEN_CARROT", "HONEY_BOTTLE", "MELON_SLICE", "MUSHROOM_STEW", "MUTTON", "POISONOUS_POTATO", "PORKCHOP", "POTATO", "PUFFERFISH", "PUMPKIN_PIE", "RABBIT", "RABBIT_STEW", "ROTTEN_FLESH", "SALMON", "SPIDER_EYE", "SUSPICIOUS_STEW", "SWEET_BERRIES", "TROPICAL_FISH" ]

  ability-two:
    enabled: true
    # Lucky Strike
    cooldown: 60
    duration: 15

    # Maximum random damage multiplier.
    # 1.5 = maximum of 1.5x damage.
    max-damage: 1.3

    # Time allowed to land the hit after charging.
    charge-duration: 60

# ==============================
#         STORM BLADE
# ==============================

storm:

  passive:
    enabled: true
    # How many hits to strike lightning (e.g. 10 is every tenth hit)
    hits-to-strike: 10

  ability-one:
    enabled: true
    cooldown: 45
    duration: 10

    # How many hits to strike lightning while the ability is
    # active (e.g. 1 is every hit, 2 is every other hit)
    strike-hits: 1

    # How long the ability remains charged for before it deactivates
    charge-duration: 60

  ability-two:
    enabled: true
    cooldown: 60
    duration: 10

    radius: 10

    # How many ticks between each lightning strike
    # NOTE: it is in ticks not seconds
    strike-interval: 20

    # The amplifiers for the potion effects
    # NOTE: the values are one less than their usual values
    # So, regeneration 1 is 0 in this config, and regeneration 2 is 1 in this config
    regen-amplifier: 1
    slowness-amplifier: 0
    weakness-amplifier: 0